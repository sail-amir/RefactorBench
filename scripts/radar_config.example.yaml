# Copy this file and edit paths/styles for a specific radar chart.
out: runs/refactorbench_radar.png
sort: fixed
min_support: 1
drop_zero_axes: false
no_shading: false
no_legend: false

fig_width: 13
fig_height: 14
dpi: 200
# Optional manual polar box as figure fractions. Leave unset to auto-keep it square.
# axes_rect: [0.19, 0.235, 0.62, 0.575714]

label_font_size: 15
label_pad: 20
label_width: 16
radial_font_size: 10
legend_font_size: 14
legend_label_width: 16

runs:
  - path: runs/glm51__descriptive
    label: Glm-5.1
    role: frontier
    legend_name: GLM-5.1 (frontier)
    legend_order: 0
    style:
      color: "#1A237E"
      line_style: [6, 4]
      line_width: 2.2
      fill_alpha: 0.0
      zorder: 5

  - path: runs/pangu-7b-5k-refactoring-mini-full-att2__descriptive
    label: Pangu-7b-stg2-refactoring
    role: hero
    legend_name: pangu-7b-refactoring
    legend_order: 1
    style:
      color: "#1B7F3B"
      line_style: solid
      line_width: 2.6
      fill_alpha: 0.40
      zorder: 4

  - path: runs/pangu35b__descriptive
    label: Pangu-35b
    role: baseline35
    legend_name: pangu-35b
    legend_order: 2
    style:
      color: "#D98A29"
      line_style: solid
      line_width: 2.2
      fill_alpha: 0.07
      zorder: 2

  - path: runs/pangu-7b-0417-stg2-baseline-mini-full__descriptive
    label: Pangu-7b-stg2
    role: baseline7
    legend_name: pangu-7b
    legend_order: 3
    style:
      color: "#B22234"
      line_style: [4, 3]
      line_width: 2.2
      fill_alpha: 0.07
      zorder: 2
